<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrew Woo-jong Lee</title>
<meta name="description" content="Andrew Woo-jong Lee — mathematician, philosopher, artist.">

<style>
  :root {
    --paper: #ffffff;
    --ink: #111111;
    --ink-soft: #555555;
    --line: #dddddd;
    --link: #111111;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Times New Roman", Times, "Liberation Serif", Georgia, serif;
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  #content {
    max-width: 880px;
    margin: 0 auto;
    padding: 80px 64px 120px;
  }

  #content.loading { color: var(--ink-soft); }

  /* Name / h1 */
  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  /* the "I am a mathematician..." line sits right under h1 as a <p> */
  h1 + p {
    color: var(--ink-soft);
    margin: 0 0 4px;
  }

  /* Contact block: a <p><strong>Contact</strong> ...</p> */
  p:has(> strong:first-child:only-child) {
    margin-top: 18px;
    margin-bottom: 2px;
  }

  h2 {
    font-size: 24px;
    letter-spacing: 0.01em;
    color: var(--ink);
    font-weight: 700;
    margin: 52px 0 20px;
  }

  h3 {
    font-size: 20px;
    font-weight: 700;
    font-style: italic;
    margin: 30px 0 8px;
  }

  p { margin: 0 0 10px; }

  ul {
    margin: 0 0 14px;
    padding-left: 20px;
  }
  li { margin-bottom: 4px; }
  li ul { margin-top: 4px; }

  hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 44px 0;
  }

  hr + h2 { margin-top: 0; }

  .tab-nav {
    display: flex;
    gap: 28px;
    margin: 44px 0 40px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .tab-nav a {
    color: var(--ink-soft);
    text-decoration: none;
    font-weight: 700;
    font-size: 18px;
    padding-bottom: 4px;
  }
  .tab-nav a:hover { color: var(--ink); }
  .tab-nav a.active {
    color: var(--ink);
    border-bottom: 2px solid var(--ink);
  }
  .tab-panel[hidden] { display: none; }
  .tab-panel > h2:first-child { margin-top: 0; }

  a {
    color: var(--link);
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }
  a:hover { color: var(--ink-soft); }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  strong { font-weight: 600; }
  em { font-style: italic; color: var(--ink); }

  /* paragraphs that immediately follow a bold "talk/paper title" line
     read as the description line — keep them tight against the title */
  h3 + p, p + p { margin-top: -2px; }

  ::selection { background: #111111; color: #ffffff; }

  @media (max-width: 700px) {
    body { font-size: 17px; }
    #content { padding: 48px 28px 80px; }
    h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<div id="content" class="loading">Loading…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  fetch('content.md')
    .then(function (res) {
      if (!res.ok) throw new Error('content.md not found (status ' + res.status + ')');
      return res.text();
    })
    .then(function (md) {
      var el = document.getElementById('content');
      el.classList.remove('loading');
      el.innerHTML = marked.parse(md);
      document.title = (md.match(/^#\s+(.+)$/m) || [, document.title])[1];

      // give every heading a stable, linkable id (e.g. "## Mathematics" -> id="mathematics")
      var used = {};
      el.querySelectorAll('h1, h2, h3').forEach(function (h) {
        var slug = h.textContent
          .toLowerCase()
          .trim()
          .replace(/[^\w\s-]/g, '')
          .replace(/\s+/g, '-');
        if (used[slug]) { used[slug]++; slug += '-' + used[slug]; }
        else { used[slug] = 1; }
        h.id = slug;
      });

      // build tabs for these top-level sections, in this order
      var TAB_IDS = ['mathematics', 'philosophy', 'art'];
      var panels = {};

      TAB_IDS.forEach(function (id) {
        var heading = document.getElementById(id);
        if (!heading) return; // section not present, skip gracefully

        var panel = document.createElement('div');
        panel.className = 'tab-panel';
        panel.id = 'panel-' + id;
        heading.parentNode.insertBefore(panel, heading);

        // move heading + everything until the next H2 or HR into this panel
        var node = heading;
        while (node) {
          var next = node.nextSibling;
          var stop = next && next.nodeType === 1 && (next.tagName === 'H2' || next.tagName === 'HR');
          panel.appendChild(node);
          if (stop || !next) break;
          node = next;
        }
        panels[id] = panel;
      });

      // clean up now-redundant <hr> separators that used to sit between two tab sections
      el.querySelectorAll(':scope > hr').forEach(function (hr) {
        var prev = hr.previousElementSibling;
        var next = hr.nextElementSibling;
        if (prev && next && prev.classList.contains('tab-panel') && next.classList.contains('tab-panel')) {
          hr.remove();
        }
      });

      // build the nav and insert it right before the first panel
      var firstPanel = panels[TAB_IDS.find(function (id) { return panels[id]; })];
      if (firstPanel) {
        var nav = document.createElement('nav');
        nav.className = 'tab-nav';
        TAB_IDS.forEach(function (id) {
          if (!panels[id]) return;
          var a = document.createElement('a');
          a.href = '#' + id;
          a.textContent = panels[id].querySelector('h2').textContent;
          a.dataset.tab = id;
          nav.appendChild(a);
        });
        firstPanel.parentNode.insertBefore(nav, firstPanel);

        function showTab(id) {
          if (!panels[id]) id = TAB_IDS.find(function (t) { return panels[t]; });
          TAB_IDS.forEach(function (t) {
            if (!panels[t]) return;
            panels[t].hidden = t !== id;
          });
          nav.querySelectorAll('a').forEach(function (a) {
            a.classList.toggle('active', a.dataset.tab === id);
          });
        }

        window.addEventListener('hashchange', function () {
          var id = location.hash.replace('#', '');
          if (panels[id]) showTab(id);
        });

        var initial = location.hash.replace('#', '');
        showTab(panels[initial] ? initial : TAB_IDS[0]);
      }
    })
    .catch(function (err) {
      var el = document.getElementById('content');
      el.classList.remove('loading');
      el.innerHTML =
        '<p><strong>Could not load content.md.</strong></p>' +
        '<p>' + err.message + '</p>' +
        '<p>This page fetches content.md at runtime, which requires being served over http(s) ' +
        '— opening index.html directly as a local file (file://) will not work due to browser ' +
        'security restrictions. Serve it locally (e.g. <code>python3 -m http.server</code>) or ' +
        'deploy it to GitHub Pages / Netlify / Vercel, where it will work normally.</p>';
    });
</script>

</body>
</html>
